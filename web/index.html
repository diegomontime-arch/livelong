<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HitLook">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png"/>

  <!-- Open Graph (default — /a/:slug overrides via og-bootstrap.js) -->
  <title>HitLook</title>
  <meta name="description" content="Proteção familiar inteligente">
  <meta property="og:site_name" content="HitLook">
  <meta property="og:title" content="HitLook">
  <meta property="og:description" content="Proteção familiar inteligente">
  <meta property="og:image" content="https://hitlook-app.web.app/icons/og-image.png">
  <meta property="og:image:secure_url" content="https://hitlook-app.web.app/icons/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://hitlook-app.web.app">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="HitLook">
  <meta name="twitter:description" content="Proteção familiar inteligente">
  <meta name="twitter:image" content="https://hitlook-app.web.app/icons/og-image.png">
  <meta name="theme-color" content="#D4AF37">

  <link rel="manifest" href="manifest.json">
  <script src="og-bootstrap.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      width: 100%;
      background-color: #000000;
      overflow: hidden;
    }
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    #flutter-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #000000;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
